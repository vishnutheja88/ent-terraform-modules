# One buildspec for every blueprint and stage. CodePipeline passes:
#   VALUES_FILE = path in the repo, e.g. envs/dev/platform.yaml or envs/dev/apps/orders.yaml
#   STAGE       = plan | apply
# The blueprint to run is read from the values file itself (its "blueprint:" key),
# and each values file gets its own state: ent-tf/<path under envs/ without .yaml>.tfstate
#   TF_STATE_BUCKET, TF_STATE_REGION  (set on the CodeBuild project)
version: 0.2

env:
  variables:
    TF_VERSION: "1.12.2"
    TF_IN_AUTOMATION: "true"
  # Uncomment when modules come from a private Bitbucket repo:
  # secrets-manager:
  #   BB_TOKEN: bitbucket/tf-modules:token

phases:
  install:
    commands:
      - echo "Installing Terraform ${TF_VERSION}"
      - curl -sSLo /tmp/tf.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      - unzip -o -q /tmp/tf.zip -d /usr/local/bin && terraform version
      - pip install --quiet check-jsonschema checkov pyyaml
      # Private Bitbucket module auth (git:: sources)
      - |
        if [ -n "${BB_TOKEN:-}" ]; then
          git config --global url."https://x-token-auth:${BB_TOKEN}@bitbucket.company.com/".insteadOf "https://bitbucket.company.com/"
        fi

  pre_build:
    commands:
      - VALUES="$CODEBUILD_SRC_DIR/${VALUES_FILE}"
      - test -f "$VALUES" || { echo "Missing $VALUES"; exit 1; }
      - BLUEPRINT=$(python3 -c "import sys,yaml; print(yaml.safe_load(open(sys.argv[1]))['blueprint'])" "$VALUES")
      - test -d "$CODEBUILD_SRC_DIR/blueprints/$BLUEPRINT" || { echo "Unknown blueprint '$BLUEPRINT'"; exit 1; }
      - STATE_KEY="ent-tf/$(echo "${VALUES_FILE#envs/}" | sed 's/\.yaml$//').tfstate"
      - echo "Blueprint=$BLUEPRINT  Values=$VALUES_FILE  State=$STATE_KEY"
      - cd "$CODEBUILD_SRC_DIR/blueprints/$BLUEPRINT"
      - |
        terraform init -input=false \
          -backend-config="bucket=${TF_STATE_BUCKET}" \
          -backend-config="key=${STATE_KEY}" \
          -backend-config="region=${TF_STATE_REGION}"

  build:
    commands:
      - |
        set -e
        if [ "$STAGE" = "plan" ]; then
          echo "== 1. Schema validation of $VALUES_FILE"
          check-jsonschema --schemafile "$CODEBUILD_SRC_DIR/schema/${BLUEPRINT}.schema.json" "$VALUES"

          echo "== 2. fmt + validate"
          terraform fmt -check -recursive "$CODEBUILD_SRC_DIR" || echo "WARN: run 'terraform fmt -recursive' before committing"
          terraform validate

          echo "== 3. plan"
          terraform plan -input=false -var "values_file=$VALUES" -out=tfplan
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json

          echo "== 4. Security scan of plan (soft-fail; make it hard-fail for prod)"
          checkov -f plan.json --framework terraform_plan --compact --quiet --soft-fail

        elif [ "$STAGE" = "apply" ]; then
          echo "== Applying the exact plan that was approved"
          terraform apply -input=false -auto-approve tfplan
          terraform output -json > outputs.json
          cat outputs.json
        else
          echo "Unknown STAGE=$STAGE"; exit 1
        fi

artifacts:
  files:
    - "**/*"
  exclude-paths:
    - "blueprints/*/.terraform/**/*"
